<div class="after"><h2>Content after the hero</h2><p>The wall stays inside its section.</p></div>
<div class="log" id="log"></div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(location.search), el = document.getElementById("foogallery-gallery-1"),
            data = JSON.parse(el.getAttribute("data-foogallery"));
        ["click", "position", "tilt", "speed", "columns", "shade"].forEach(function (key) {
            if (params.has(key)) data.template[key] = isNaN(params.get(key)) ? params.get(key) : Number(params.get(key));
        });
        el.setAttribute("data-foogallery", JSON.stringify(data));
        document.addEventListener("foogallery-wall-click", function (e) {
            document.getElementById("log").textContent = "foogallery-wall-click: " + e.detail.title;
        });
        FooGallery.init({}, el);
    });
</script>
